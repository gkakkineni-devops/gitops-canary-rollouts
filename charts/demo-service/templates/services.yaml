apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-service.name" . }}-stable
  labels:
    {{- include "demo-service.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "demo-service.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-service.name" . }}-canary
  labels:
    {{- include "demo-service.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "demo-service.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
