name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARGO_ROLLOUTS_VERSION: v1.7.2
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    name: Lint and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint charts/demo-service --strict

      - name: Render the chart
        run: |
          helm template demo charts/demo-service > rendered.yaml
          helm template demo charts/demo-service --set analysis.enabled=false > /dev/null

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform

      - name: Validate against the Kubernetes and Argo schemas
        run: |
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml argocd/application.yaml

      - name: Scan the manifests with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  e2e:
    name: Roll out a good and a bad release on kind
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: helm/kind-action@v1
        with:
          cluster_name: canary

      - name: Install Argo Rollouts and its kubectl plugin
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply -n argo-rollouts -f "https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/install.yaml"
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=120s
          curl -sSL -o kubectl-argo-rollouts "https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64"
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/

      - name: Run the release tests
        run: ./scripts/e2e.sh

      - name: Show cluster state when something failed
        if: failure()
        run: |
          kubectl get all,rollout,analysisrun -n demo || true
          kubectl describe rollout demo -n demo || true
          kubectl -n argo-rollouts logs deploy/argo-rollouts --tail=80 || true
